<div *ngIf="toast"
      class="fixed top-5 right-5 px-4 py-3 rounded shadow-lg flex items-center justify-between min-w-[280px] border-l-4"
      [ngClass]="{
        'border-green-600': toast.type === 'success',
        'border-red-600': toast.type === 'error',
        'border-blue-600': toast.type === 'info',
        'border-yellow-500': toast.type === 'warning'
      }"
      style="background-color: white; color: black;">
      
      <!-- Icon + Message -->
      <div class="flex items-center space-x-2">
        <span *ngIf="toast.type === 'success'" class="text-green-600">✔️</span>
        <span *ngIf="toast.type === 'error'" class="text-red-600">❌</span>
        <span *ngIf="toast.type === 'info'" class="text-blue-600">ℹ️</span>
        <span *ngIf="toast.type === 'warning'" class="text-yellow-600">⚠️</span>
        <span class="font-medium">{{ toast.text }}</span>
      </div>

      <!-- Close Button -->
      <button (click)="closeToast()" 
        class="ml-3 text-lg font-bold text-gray-500 hover:text-black focus:outline-none">
        ×
      </button>
    </div>
