<app-loader *ngIf="loader"></app-loader>
<div class="panel-body">

  <div class="flex justify-center bg-gray-100 login-bg" *ngIf="loginPage">
    <div class="border border-gray-300 p-8 rounded-none w-full bg-white text-center formInsideLogin">
      <h2 class="text-2xl heading font-bold mb-6">VOLUNTEER LOGIN</h2>

      <!-- Login Form -->
      <form [formGroup]="loginForm" (ngSubmit)="login()">

        <div class="mb-4">
          <input type="email" formControlName="userName" placeholder="Email"
            class="w-full px-3 py-2 border border-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500"
            required />
        </div>

        <!-- PASSWORD INPUT WITH EYE ICON -->
        <div class="mb-2 relative">
          <input [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="Password"
            class="w-full px-3 py-2 pr-12 border border-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500"
            required />

          <!-- Eye Icon -->
          <span class="password-eye" (click)="showPassword = !showPassword">

            <ng-container *ngIf="showPassword; else hideEye">
              👁️
            </ng-container>

            <ng-template #hideEye>
              👁️‍🗨️
            </ng-template>

          </span>
        </div>


        <div class="flex justify-between text-sm text-gray-700 mb-4 consern">
          <a (click)="forgetPassword()" style="cursor: pointer;" class="hover:text-purple-600">Forgot Password ?</a>
          <a class="hover:text-purple-600" (click)="loginPage = false; signUpPage = true;" style="cursor: pointer;">
            Create an Account
          </a>
        </div>

        <button type="submit" class="w-full text-white font-bold py-2 rounded-sm transition signInBtn">
          SIGN IN
        </button>

        <div class="mt-4 google-signIn">
          <button type="button" (click)="signInWithGoogle()"
            class="w-full border border-gray-400 py-2 flex items-center justify-center hover:bg-gray-50 transition">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google logo"
              class="w-5 h-5 google-img" />
            <p class="google-signIn-text">&nbsp; Continue with Google</p>
          </button>
        </div>

      </form>

    </div>
  </div>


  <!-- SignUP -->

  <div class="flex justify-center bg-gray-100 p-6" *ngIf="signUpPage">
    <div class="w-full max-w-6xl bg-white border border-gray-300 rounded-lg p-6">

      <h2 class="text-lg font-bold text-center create-prfile mb-8">Create a Profile</h2>

      <!-- FORM START -->
      <form [formGroup]="signUpForm" class="grid grid-cols-12 gap-6">

        <!-- LEFT PANEL: PROFILE PHOTO -->
        <div class="col-span-12 md:col-span-4">
          <h3 class="text-xl bold-font mb-4">Profile Picture *</h3>

          <div class="relative w-40 h-40 mx-auto mb-4">
            <img *ngIf="previewUrl; else noPhoto" [src]="previewUrl"
              class="w-full h-full rounded-lg object-cover border border-gray-300" />

            <ng-template #noPhoto>
              <div class="w-full h-full rounded-lg bg-gray-200 flex items-center justify-center text-gray-500">
                No Image
              </div>
            </ng-template>
          </div>

          <label>
            <input type="file" class="hidden" (change)="onFileSelected($event)" accept="image/*" />
            <div
              class="cursor-pointer bg-gray-100 border border-gray-300 py-2 text-center rounded-md hover:bg-gray-200">
              Select Image
            </div>
          </label>
        </div>

        <!-- RIGHT PANEL: PROFILE INFO -->
        <div class="col-span-12 md:col-span-8">

          <!-- Profile Information -->
          <h3 class="text-lg bold-font mb-4">Profile Information</h3>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="text-sm">First Name *</label>
              <input type="text" formControlName="firstName" class="w-full border border-gray-300 p-2 rounded-md" />
            </div>

            <div>
              <label class="text-sm">Last Name *</label>
              <input type="text" formControlName="lastName" class="w-full border border-gray-300 p-2 rounded-md" />
            </div>

            <div class="col-span-2">
              <label class="text-sm">School / Organization Affiliation *</label>
              <input type="text" formControlName="schoolOrOrganization"
                class="w-full border border-gray-300 p-2 rounded-md" />
            </div>

            <div>
              <label class="text-sm">Date of Birth *</label>
              <!-- <input type="date" formControlName="dob" class="w-full border border-gray-300 p-2 rounded-md" /> -->
              <mat-form-field appearance="outline" class="w-full mt-1 mat-input-match">
                <input matInput [matDatepicker]="dob" formControlName="dob" name="dob" placeholder="Date of Birth"
                  [max]="today" required />
                <mat-datepicker-toggle matSuffix [for]="dob"></mat-datepicker-toggle>
                <mat-datepicker #dob></mat-datepicker>
              </mat-form-field>
            </div>

            <div>
              <label class="text-sm">State / Region *</label>
              <input type="text" formControlName="state" class="w-full border border-gray-300 p-2 rounded-md" />
            </div>

            <div class="col-span-2">
              <label class="text-sm">Country *</label>
              <input type="text" formControlName="country" class="w-full border border-gray-300 p-2 rounded-md" />
            </div>
          </div>

          <br>

          <!-- Contact Info -->
          <h3 class="text-lg bold-font mb-4">Contact Information</h3>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="text-sm">Phone Number *</label>
              <input type="text" formControlName="phoneNumber" class="w-full border border-gray-300 p-2 rounded-md" />
            </div>

            <div>
              <label class="text-sm">Email *</label>
              <input type="email" formControlName="email" class="w-full border border-gray-300 p-2 rounded-md" />
            </div>
          </div>

          <br>

          <!-- Causes -->
          <h3 class="text-lg bold-font mb-2">Causes / Areas of Interest *</h3>
          <input type="text" formControlName="interests" class="w-full border border-gray-300 p-2 rounded-md" />

          <br>

          <!-- Password -->
          <h3 class="text-lg bold-font mb-2">Create Password *</h3>
          <!-- <input type="password" formControlName="password" class="w-full border border-gray-300 p-2 rounded-md" /> -->
          <div class="mb-2 relative">

            <!-- placeholder="Create Password" -->
            <input [type]="showPassword ? 'text' : 'password'" formControlName="password"
              class="w-full px-3 py-2 pr-12 border border-gray-400 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-500"
              required />

            <!-- Eye Icon Inside Input -->
            <span class="absolute right-3 top-1/2 -translate-y-1/2 cursor-pointer text-xl craete-pass"
              (click)="showPassword = !showPassword">
              <ng-container *ngIf="showPassword; else hideEye">👁️</ng-container>
              <ng-template #hideEye>👁️‍🗨️</ng-template>
            </span>

          </div>


          <div class="mt-6 text-center">
            <button type="button" (click)="signUp()"
              class="bg-purple-700 text-white px-8 py-2 rounded-md hover:bg-purple-800">
              SIGN UP
            </button>

            <div class="mt-4 text-sm">
              <a (click)="forgetPassword()" class="hover:text-purple-800 cursor-pointer">Forgot Password ?</a>
              <br />
              <a (click)="loginPage = true; signUpPage = false;" class="hover:text-purple-800 cursor-pointer">
                Already have an account?
              </a>
            </div>
          </div>

        </div>
      </form>
      <!-- FORM END -->

    </div>
  </div>


</div>
