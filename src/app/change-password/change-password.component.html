<div class="flex justify-center bg-gray-100 main">
  <div class="border border-gray-300 bg-white w-full max-w-5xl p-6 md:p-10">

    <h2 class="text-2xl heading font-bold mb-6 text-left">CHANGE PASSWORD</h2>

    <form
      [formGroup]="changePassword"
      class="grid grid-cols-1 md:grid-cols-3 gap-6 text-left"
    >

      <!-- Old Password -->
      <div class="relative">
        <label class="block text-sm font-semibold mb-1">Old Password</label>
        <input
          [type]="showOldPassword ? 'text' : 'password'"
          formControlName="oldPassword"
          class="w-full border border-gray-400 px-3 py-2 pr-10 focus:ring-2 focus:ring-purple-500"
        />
        <button
          type="button"
          (click)="togglePassword('old')"
          class="showPassBtn"
        >
          <i class="material-icons">
            {{ showOldPassword ? 'visibility_off' : 'visibility' }}
          </i>
        </button>
      </div>

      <!-- New Password -->
      <div class="relative">
        <label class="block text-sm font-semibold mb-1">New Password</label>
        <input
          [type]="showNewPassword ? 'text' : 'password'"
          formControlName="newPassword"
          class="w-full border border-gray-400 px-3 py-2 pr-10 focus:ring-2 focus:ring-purple-500"
        />
        <button
          type="button"
          (click)="togglePassword('new')"
          class="showPassBtn"
        >
          <i class="material-icons">
            {{ showNewPassword ? 'visibility_off' : 'visibility' }}
          </i>
        </button>
      </div>

      <!-- Confirm Password -->
      <div class="relative">
        <label class="block text-sm font-semibold mb-1">
          Confirm New Password
        </label>
        <input
          [type]="showConfirmPassword ? 'text' : 'password'"
          formControlName="confirmNewPassword"
          class="w-full border border-gray-400 px-3 py-2 pr-10 focus:ring-2 focus:ring-purple-500"
        />
        <button
          type="button"
          (click)="togglePassword('confirm')"
          class="showPassBtn"
        >
          <i class="material-icons">
            {{ showConfirmPassword ? 'visibility_off' : 'visibility' }}
          </i>
        </button>
      </div>

      <!-- Submit Button -->
      <div class="md:col-span-3 flex justify-center mt-6">
        <button
          type="submit"
          (click)="changePasswordFun()"
          class="updatebtn"
        >
          SUBMIT
        </button>
      </div>

    </form>
  </div>
</div>
